name: Intraday Stock Screener Monitor

on:
  schedule:
    # Every ~2 hours during US market hours (Mon-Fri).
    # NYSE: 9:30 AM - 4:00 PM ET = 13:30-20:00 UTC (EDT) / 14:30-21:00 UTC (EST)
    #
    # These are lightweight monitoring runs that download intraday prices
    # for held positions only and evaluate exit logic (stops, trailing stops,
    # peak detection). They do NOT re-run ML predictions or universe screening.
    #
    #                          EST (winter)      EDT (summer)       Emails by
    # ────────────────────────────────────────────────────────────────────────
    # INTRADAY-1  15:00 UTC    10:00 AM          11:00 AM          ~11:02 AM EDT
    # INTRADAY-2  17:00 UTC    12:00 PM           1:00 PM          ~ 1:02 PM EDT
    # INTRADAY-3  19:00 UTC     2:00 PM           3:00 PM          ~ 3:02 PM EDT
    #
    # Triggers 30 min early so the ~1-2 min pipeline finishes on time.

    - cron: '0 15 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '0 19 * * 1-5'
  workflow_dispatch:

concurrency:
  group: intraday-stock-screener
  cancel-in-progress: true  # OK to skip stale intraday runs

permissions:
  contents: read
  actions: read

jobs:
  intraday_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-actions.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Restore data/state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/
            data_cache/
            screener_portfolio_state.json
            screener_portfolio_state.json.bak
            screener_portfolio_state.json.events.jsonl
          key: ${{ runner.os }}-daily-screener-data-${{ hashFiles('requirements-actions.txt', '.github/workflows/daily-stock-screener.yml') }}
          restore-keys: |
            ${{ runner.os }}-daily-screener-data-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-actions.txt

      - name: Run intraday monitor
        env:
          INTRADAY_ENABLED: "1"
          INTRADAY_EXIT_ONLY: "0"  # Also execute new entries from daily target weights
          PORTFOLIO_STATE_PATH: "screener_portfolio_state.json"
          PORTFOLIO_BUDGET_CAD: "500"
          # Exit parameters (match daily run)
          TRAILING_STOP_ENABLED: "1"
          TRAILING_STOP_ACTIVATION_PCT: "0.05"
          TRAILING_STOP_DISTANCE_PCT: "0.08"
          VOL_ADJUSTED_STOP_ENABLED: "1"
          VOL_ADJUSTED_STOP_BASE: "0.08"
          VOL_ADJUSTED_STOP_MIN: "0.04"
          VOL_ADJUSTED_STOP_MAX: "0.15"
          QUICK_PROFIT_PCT: "0.03"
          QUICK_PROFIT_DAYS: "2"
          PEAK_DETECTION_ENABLED: "1"
          PEAK_SELL_PORTION_PCT: "0.50"
          MAX_HOLDING_DAYS: "3"
          MAX_HOLDING_DAYS_HARD: "5"
          SIGNAL_DECAY_EXIT_ENABLED: "1"
          SIGNAL_DECAY_THRESHOLD: "-0.02"
          INTRADAY_MIN_PRICE_MOVE_PCT: "0.02"
          INTRADAY_STALE_THRESHOLD_HOURS: "18"
          INTRADAY_TICKER_LIMIT: "100"
          INTRADAY_WATCHLIST_TOP_N: "20"
        run: |
          python -m stock_screener.cli intraday --log-level INFO

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache/
            data_cache/
            screener_portfolio_state.json
            screener_portfolio_state.json.bak
            screener_portfolio_state.json.events.jsonl
          key: ${{ runner.os }}-daily-screener-data-${{ hashFiles('requirements-actions.txt', '.github/workflows/daily-stock-screener.yml') }}-intraday-${{ github.run_id }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-monitor-${{ github.run_number }}
          path: |
            reports/intraday_report.txt
            reports/intraday_email.html
            cache/last_intraday_meta.json
          retention-days: 7

      - name: Send monitoring email
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "[Intraday] Portfolio Monitor"
          to: ${{ secrets.EMAIL_TO || secrets.EMAIL_USERNAME }}
          from: Stock Screener Bot <${{ secrets.EMAIL_USERNAME }}>
          html_body: file://reports/intraday_email.html
          attachments: reports/intraday_report.txt
